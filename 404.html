<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found — Tidelyne</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#040d18">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="icon" href="/JAC_Online/favicon.ico" sizes="16x16 32x32">
<link rel="icon" type="image/svg+xml" href="/JAC_Online/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts CSS is preloaded and promoted to a stylesheet once it arrives, so first paint never waits on the cross-origin request (display=swap covers the font files). -->
<link rel="preload" as="style" crossorigin href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap"></noscript>
<style>
html{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#040d18;color:#b0c4d8;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;padding-left:max(2rem,env(safe-area-inset-left));padding-right:max(2rem,env(safe-area-inset-right));line-height:1.7}
.wrap{max-width:460px}
h1{font-family:'Bebas Neue','DM Sans',sans-serif;font-weight:400;color:#eef3f8;font-size:4.5rem;letter-spacing:3px;line-height:1;margin-bottom:0.5rem}
p{font-size:1rem;margin-bottom:1.5rem}
a.btn{display:inline-block;background:#00d4ff;color:#040d18;text-decoration:none;font-weight:700;letter-spacing:1px;padding:12px 26px;border-radius:8px;text-transform:uppercase;font-size:0.8rem}
a.btn:hover{background:#00b0d8}
a.btn:focus-visible{outline:2px solid #eef3f8;outline-offset:3px} /* the UA ring is invisible on the cyan fill */
.small{font-size:0.8rem;color:#8ba5bd;margin-top:1.25rem}
</style>
</head>
<body>
<main class="wrap">
<h1>404</h1>
<p>That page isn't here. Tidelyne is a single app — its sections live at the home page.</p>
<a class="btn" id="home-link" href="/JAC_Online/">Go to Tidelyne <span aria-hidden="true">→</span></a>
<p class="small">Check the address for typos, or use the button above.</p>
</main>
<script>
// GitHub Pages serves this file AT the missing URL, so relative links resolve
// against that path (for /JAC_Online/foo/bar/ a './' link points back at the
// 404 itself). Work out the site root once — the project folder on *.github.io,
// the origin root anywhere else — and use it for the button and the icon.
// No timed redirect: a change of context on a timer is a WCAG 2.2.1 / 3.2.5
// problem for anyone still reading, and the button above is the way home.
(function(){
  var ROOT = /\.github\.io$/i.test(location.hostname) ? '/' + (location.pathname.split('/')[1] || '') + '/' : '/';
  if (ROOT === '//') ROOT = '/';
  var link = document.getElementById('home-link'); if (link) link.href = ROOT;
  document.querySelectorAll('link[rel="icon"]').forEach(function(icon){ icon.href = ROOT + icon.href.split('/').pop(); });
})();
</script>
</body>
</html>
